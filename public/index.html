<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Tredella API</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f9fc;
        color: #4b566b;
        font: 15px/1.6 system-ui, -apple-system, Segoe UI, sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 2.5rem;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 3px rgba(43, 52, 69, 0.1);
      }
      h1 {
        margin: 0 0 0.25rem;
        color: #2b3445;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: #7d879c;
        font-size: 0.9rem;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li + li {
        margin-top: 0.5rem;
      }
      code {
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
        background: #f6f9fc;
        color: #2b3445;
        font-size: 0.85rem;
      }
      a {
        color: #e94560;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tredella marketplace API</h1>
      <p>GraphQL API for the Tredella retail &amp; wholesale marketplace.</p>
      <ul>
        <li><code>POST /graphql</code> — GraphQL endpoint</li>
        <li><code>GET <a href="/health">/health</a></code> — service status</li>
        <li><code>GET <a href="/auth/providers">/auth/providers</a></code> — enabled sign-in providers</li>
      </ul>
    </main>
  </body>
</html>
