type Address {
  id: ID!
  label: String!
  fullName: String!
  phone: String!
  line1: String!
  city: String!
  country: String!
  isDefault: Boolean!
}

type User {
  id: ID!
  email: String!
  name: String!
  role: String!
  avatar: String
  createdAt: String!
  addresses: [Address!]!
}

type AuthPayload {
  token: String!
  user: User!
}

type PasswordResetRequestResult {
  """Always true — never reveals whether the email is registered"""
  ok: Boolean!

  """
  False when SMTP is unconfigured (dev): the link is logged to the server console
  """
  emailSent: Boolean!
}

type PasswordResetTokenPayload {
  """Single-use token, valid for the rest of the reset window"""
  token: String!
}

type Category {
  id: ID!
  slug: String!
  name: String!
  icon: String
  subcategories: [Subcategory!]!
  productCount(mode: Mode!): Int!
}

"""Storefront the request applies to."""
enum Mode {
  RETAIL
  WHOLESALE
}

type Subcategory {
  id: ID!
  slug: String!
  name: String!
  category: Category!
  productCount(mode: Mode!): Int!
}

type Seller {
  id: ID!
  slug: String!
  name: String!
  logo: String
  description: String
  verified: Boolean!
  rating: Float!
  positivePercent: Float!
  followers: Int!
  shipsFrom: String!
  deliveryEstimate: String!
  freeShippingOver: Float
  joinedAt: String!
  productCount: Int!
}

type PriceTier {
  id: ID!
  minQty: Int!
  maxQty: Int
  price: Float!
}

type ProductAttribute {
  name: String!
  value: String!
}

type ProductImage {
  id: ID!
  url: String!
  position: Int!
}

type Product {
  id: ID!
  slug: String!
  sku: String!
  name: String!
  description: String!
  image: String!
  images: [ProductImage!]!
  brand: String
  category: Category!
  subcategory: Subcategory!
  seller: Seller!
  retailPrice: Float!
  oldPrice: Float
  priceTiers: [PriceTier!]!

  """Cheapest wholesale per-unit price (highest tier)"""
  wholesaleFrom: Float
  minOrder: Int!
  stock: Int!
  inStock: Boolean!
  availableRetail: Boolean!
  availableWholesale: Boolean!
  rating: Float!
  reviewsCount: Int!
  sold: Int!
  deliveryDays: String!
  freeShipping: Boolean!
  attributes: [ProductAttribute!]!
  createdAt: String!

  """PENDING | APPROVED | REJECTED — an admin decision"""
  approvalStatus: String!

  """The reviewer's reason, set when the status is REJECTED"""
  approvalNote: String
}

type PageInfo {
  total: Int!
  page: Int!
  pageSize: Int!
  totalPages: Int!
  hasNextPage: Boolean!
}

type FacetValue {
  value: String!
  count: Int!
}

type Facet {
  name: String!
  values: [FacetValue!]!
}

type PriceRange {
  min: Float!
  max: Float!
}

type ProductConnection {
  items: [Product!]!
  pageInfo: PageInfo!

  """Dynamic facets for the current result set (attribute name -> values)"""
  facets: [Facet!]!
  brands: [String!]!
  priceRange: PriceRange!
}

"""Quote for a quantity — calculated server-side from DB tiers"""
type PriceQuote {
  quantity: Int!
  unitPrice: Float!
  total: Float!
  mode: Mode!
}

type HomePageData {
  heroProducts: [Product!]!
  flashDeals: [Product!]!
  topRated: [Product!]!
  newArrivals: [Product!]!
  bigDiscounts: [Product!]!
  categories: [Category!]!
}

"""A KYC file backing the seller registration."""
type SellerDocument {
  id: ID!
  type: SellerDocumentType!
  url: String!
  fileName: String!
  mimeType: String!
  sizeBytes: Int!
  uploadedAt: String!
}

enum SellerDocumentType {
  TRADE_LICENSE
  EMIRATES_ID_FRONT
  EMIRATES_ID_BACK
  VAT_CERTIFICATE
}

type SellerAccount {
  id: ID!
  slug: String!

  """Trading name shown to buyers"""
  name: String!
  logo: String

  """Name as printed on the trade licence"""
  legalName: String
  legalForm: LegalForm
  emirate: Emirate
  addressLine: String
  phone: String
  tradeLicenseNumber: String
  tradeLicenseExpiry: String
  emiratesIdNumber: String

  """15-digit VAT number; only required above AED 375,000 turnover"""
  trn: String
  verificationStatus: VerificationStatus!

  """Reviewer's reason, set when the status is REJECTED"""
  verificationNote: String
  submittedAt: String
  documents: [SellerDocument!]!

  """Document types still missing before this can be submitted"""
  missingDocuments: [SellerDocumentType!]!
}

"""Legal form as stated on the trade licence."""
enum LegalForm {
  SOLE_ESTABLISHMENT
  LLC
  FREE_ZONE
  BRANCH
  CIVIL_COMPANY
}

enum Emirate {
  DUBAI
  ABU_DHABI
  SHARJAH
  AJMAN
  UMM_AL_QUWAIN
  RAS_AL_KHAIMAH
  FUJAIRAH
}

"""Where a seller stands in trade-licence review."""
enum VerificationStatus {
  UNSUBMITTED
  PENDING
  APPROVED
  REJECTED
}

"""One row on a plan card."""
type PlanFeature {
  id: ID!
  kind: PlanFeatureKind!

  """Bold lead-in on a NOTE row"""
  title: String
  label: String!

  """FEATURE rows render a cross when false"""
  included: Boolean!
  position: Int!
}

"""FEATURE rows tick or cross; NOTE rows are the explanatory text."""
enum PlanFeatureKind {
  FEATURE
  NOTE
}

type Plan {
  id: ID!

  """BASIC | STANDARD"""
  code: String!
  name: String!
  tagline: String
  monthlyPrice: Float!

  """Three-month total, already 10% off"""
  quarterlyPrice: Float!

  """ISO code — AED"""
  currency: String!
  sortOrder: Int!
  features: [PlanFeature!]!

  """Price for the interval asked for, so clients do no arithmetic"""
  price(interval: BillingInterval! = MONTHLY): Float!
}

"""How often a subscription renews. Quarterly is 10% cheaper."""
enum BillingInterval {
  MONTHLY
  QUARTERLY
}

"""One billing period's charge."""
type Payment {
  id: ID!
  amount: Float!
  currency: String!
  status: PaymentStatus!
  periodStart: String!
  periodEnd: String!

  """FREE until a gateway is connected"""
  provider: String!
  failureReason: String
  paidAt: String
  createdAt: String!
}

enum PaymentStatus {
  PENDING
  PAID
  FAILED
  WAIVED
  REFUNDED
}

"""A seller's plan. Named apart from GraphQL's root Subscription type."""
type SellerSubscription {
  id: ID!
  plan: Plan!
  interval: BillingInterval!

  """AED charged each period"""
  amount: Float!
  currency: String!
  status: SubscriptionStatus!
  autoRenew: Boolean!
  currentPeriodStart: String!
  currentPeriodEnd: String!
  cancelledAt: String

  """FREE until a gateway is connected"""
  provider: String!
  payments: [Payment!]!
}

enum SubscriptionStatus {
  ACTIVE
  PAST_DUE
  CANCELLED
  EXPIRED
}

"""Result of choosing a plan. Follow checkoutUrl when it is set."""
type CheckoutSession {
  subscription: SellerSubscription!

  """
  Hosted payment page to redirect to. Null while no gateway is connected — the plan is already active.
  """
  checkoutUrl: String

  """True when nothing is owed and the plan is live right away"""
  activated: Boolean!
}

type PublicUser {
  id: ID!
  name: String!
  avatar: String
}

type Review {
  id: ID!
  rating: Int!
  text: String!
  images: [String!]!
  verified: Boolean!
  createdAt: String!
  user: PublicUser!
}

type ReviewConnection {
  items: [Review!]!
  pageInfo: PageInfo!
  average: Float!

  """Count per star rating 1..5"""
  distribution: [Int!]!
}

type Question {
  id: ID!
  text: String!
  answer: String
  answeredAt: String
  createdAt: String!
  user: PublicUser!
  product: Product!
}

type CartItem {
  id: ID!
  product: Product!
  quantity: Int!
  mode: Mode!

  """Current unit price for this quantity — server calculated"""
  unitPrice: Float!
  total: Float!
}

type SellerCartGroup {
  seller: Seller!
  items: [CartItem!]!
  subtotal: Float!
}

type Cart {
  groups: [SellerCartGroup!]!
  itemCount: Int!
  total: Float!
}

type WishlistItem {
  id: ID!
  product: Product!
  mode: Mode!
  createdAt: String!
}

type OrderItem {
  id: ID!
  product: Product!
  name: String!
  image: String!
  mode: Mode!
  quantity: Int!
  unitPrice: Float!
  total: Float!

  """True if the buyer can review this item now"""
  reviewable: Boolean!
}

type SellerOrder {
  id: ID!
  seller: Seller!
  status: String!
  subtotal: Float!
  items: [OrderItem!]!
}

type Order {
  id: ID!
  mode: Mode!
  status: String!
  total: Float!
  createdAt: String!
  address: Address
  sellerOrders: [SellerOrder!]!
}

type Message {
  id: ID!
  conversationId: ID!
  sender: PublicUser!
  text: String!
  attachment: String
  readAt: String
  createdAt: String!
  isMine: Boolean!
}

type Conversation {
  id: ID!
  type: String!
  seller: Seller
  buyer: PublicUser
  product: Product
  orderId: String
  lastMessage: Message
  unreadCount: Int!
  updatedAt: String!
}

type Notification {
  id: ID!
  type: String!
  title: String!
  body: String
  link: String

  """Thumbnail for the row; clients fall back to a type icon"""
  image: String
  readAt: String
  createdAt: String!
}

type SectionAccess {
  section: String!

  """NONE | VIEW | MANAGE"""
  access: String!
}

type StaffMember {
  id: ID!
  email: String!
  name: String!

  """SUPER_ADMIN | ADMIN | EDITOR | VIEWER | CUSTOM"""
  staffRole: String!

  """Every section and the access this member has to it"""
  permissions: [SectionAccess!]!
}

type Query {
  """Every listing, including the ones buyers cannot see. Unreviewed first."""
  adminProducts(status: ApprovalStatus, sellerId: ID, search: String, page: Int = 1, pageSize: Int = 20): [Product!]!

  """Listings waiting on a decision — drives the review badge."""
  adminProductsAwaitingReview: Int!

  """
  Seller trade registrations. Awaiting review first, then oldest submission first.
  """
  adminSellerRegistrations(status: String): [SellerAccount!]!

  """Registrations waiting on a decision — drives the queue badge."""
  adminSellersAwaitingReview: Int!

  """Everyone with console access, super admins first."""
  adminTeam: [StaffMember!]!

  """
  The signed-in member's own access, so the console can shape itself to it.
  """
  myAdminAccess: [SectionAccess!]!

  """Checks a reset link before showing the new-password form"""
  verifyResetToken(token: String!): Boolean!
  me: User
  getCategories: [Category!]!
  getCategory(slug: String!): Category
  getSubcategory(categorySlug: String!, slug: String!): Subcategory
  getHomePageData(mode: Mode!): HomePageData!
  getProducts(mode: Mode!, filter: ProductFilterInput, sortBy: SortBy = RELEVANCE, page: Int = 1, pageSize: Int = 12): ProductConnection!
  getProduct(slug: String!, mode: Mode!): Product
  getPriceQuote(productId: ID!, quantity: Int!, mode: Mode!): PriceQuote!
  getRelatedProducts(productId: ID!, mode: Mode!, limit: Int = 8): [Product!]!
  searchSuggestions(query: String!, mode: Mode!): [String!]!
  getSeller(slug: String!): Seller
  getSellerProducts(sellerSlug: String!, mode: Mode!, filter: ProductFilterInput, sortBy: SortBy = RELEVANCE, page: Int = 1, pageSize: Int = 12): ProductConnection!

  """The signed-in seller's own store, including KYC state"""
  mySellerAccount: SellerAccount!

  """Seller subscription tiers, cheapest first"""
  getPlans: [Plan!]!

  """The seller's current plan, or null if they skipped"""
  mySubscription: SellerSubscription
  getProductReviews(productId: ID!, page: Int = 1, pageSize: Int = 10): ReviewConnection!
  getProductQuestions(productId: ID!): [Question!]!
  mySellerQuestions(answered: Boolean): [Question!]!
  getCart(mode: Mode!): Cart!
  getWishlist(mode: Mode): [WishlistItem!]!
  getOrders(page: Int = 1, pageSize: Int = 10): [Order!]!
  getOrder(id: ID!): Order
  getConversations: [Conversation!]!
  getMessages(conversationId: ID!, page: Int = 1, pageSize: Int = 30): [Message!]!
  getNotifications(unreadOnly: Boolean = false): [Notification!]!

  """Unread count for the bell badge, without loading the list"""
  unreadNotificationCount: Int!
}

"""Where a listing stands with the admin review."""
enum ApprovalStatus {
  PENDING
  APPROVED
  REJECTED
}

input ProductFilterInput {
  search: String
  categorySlug: String
  subcategorySlug: String
  sellerSlug: String
  brands: [String!]
  priceMin: Float
  priceMax: Float
  minRating: Float
  inStock: Boolean
  onSale: Boolean
  maxMoq: Int
  attributes: [AttributeFilterInput!]
}

input AttributeFilterInput {
  name: String!
  values: [String!]!
}

enum SortBy {
  RELEVANCE
  NEWEST
  PRICE_ASC
  PRICE_DESC
  BEST_RATED
  MOST_POPULAR
  LOWEST_WHOLESALE_PRICE
  BEST_BULK_DISCOUNT
}

type Mutation {
  """
  Approve or reject a listing. Approving clears it for sale; it does not change what the seller chose to offer.
  """
  reviewProduct(productId: ID!, status: ApprovalStatus!, note: String): Product!

  """
  Approve or reject a trade registration. Approving is what puts the verified mark on a store.
  """
  reviewSellerRegistration(sellerId: ID!, status: VerificationDecision!, note: String): SellerAccount!

  """
  Remove a document that is wrong. This is the only way a seller gets an upload slot back — their own removeSellerDocument refuses once the store is approved.
  """
  removeSellerDocumentAsAdmin(sellerId: ID!, type: SellerDocumentType!, note: String): SellerAccount!

  """Give an existing account console access, by email. Super admin only."""
  grantAdminAccess(email: String!, staffRole: String!, permissions: [SectionAccessInput!]): StaffMember!

  """
  Take console access away. The account itself is left alone. Super admin only.
  """
  revokeAdminAccess(userId: ID!): StaffMember!
  register(name: String!, email: String!, password: String!): AuthPayload!
  login(
    email: String!
    password: String!

    """
    Reject the sign-in unless the account has this role. Each dashboard passes its own.
    """
    requireRole: UserRole
  ): AuthPayload!

  """Creates a SELLER account together with its storefront"""
  registerSeller(input: SellerRegisterInput!): AuthPayload!

  """Always reports success so the response cannot reveal registered emails"""
  requestPasswordReset(email: String!): PasswordResetRequestResult!

  """
  Emails a 6-digit code instead of a link — used by the seller and admin dashboards
  """
  requestPasswordResetCode(email: String!): PasswordResetRequestResult!

  """Exchanges a correct 6-digit code for a resetPassword token"""
  verifyPasswordResetCode(email: String!, code: String!): PasswordResetTokenPayload!

  """Signs the user straight in once the new password is saved"""
  resetPassword(token: String!, newPassword: String!): AuthPayload!
  changePassword(currentPassword: String!, newPassword: String!): Boolean!
  addAddress(input: AddressInput!): Address!

  """
  Saves the trade-registration details and puts the store in the review queue
  """
  submitSellerVerification(input: SellerVerificationInput!): SellerAccount!

  """Removes an uploaded document so it can be replaced"""
  removeSellerDocument(type: SellerDocumentType!): Boolean!

  """
  Choose a plan. Redirect to checkoutUrl when it is set; when null the plan is already active.
  """
  subscribeToPlan(planCode: String!, interval: BillingInterval!): CheckoutSession!

  """Stop renewal; the plan stays usable until the period ends"""
  cancelSubscription: SellerSubscription!
  createReview(orderItemId: ID!, rating: Int!, text: String!, images: [String!]): Review!
  askProductQuestion(productId: ID!, text: String!): Question!
  answerProductQuestion(questionId: ID!, answer: String!): Question!
  addToCart(quantity: Int!, mode: Mode!, productId: ID, productSlug: String): Cart!
  updateCartItem(cartItemId: ID!, quantity: Int!): Cart!
  removeFromCart(cartItemId: ID!): Cart!

  """
  Pass either productId or productSlug — the slug is the stable public key
  """
  addToWishlist(mode: Mode!, productId: ID, productSlug: String): WishlistItem!
  removeFromWishlist(mode: Mode!, productId: ID, productSlug: String): Boolean!
  createOrder(mode: Mode!, addressId: ID): Order!
  startConversation(type: String!, sellerSlug: String, productId: ID, orderId: ID): Conversation!
  sendMessage(conversationId: ID!, text: String!, attachment: String): Message!
  markMessageAsRead(conversationId: ID!): Boolean!
  markNotificationAsRead(id: ID): Boolean!
}

"""Approve or reject a seller trade registration."""
enum VerificationDecision {
  APPROVED
  REJECTED
}

input SectionAccessInput {
  section: String!

  """NONE | VIEW | MANAGE"""
  access: String!
}

"""Account roles. Used to scope an operation to one dashboard."""
enum UserRole {
  BUYER
  SELLER
  ADMIN
}

input SellerRegisterInput {
  firstName: String!
  lastName: String!
  email: String!
  password: String!

  """
  Country the store ships from, e.g. "Pakistan"
  """
  country: String

  """Public store name. Defaults to the seller's own name."""
  storeName: String
}

input AddressInput {
  label: String!
  fullName: String!
  phone: String!
  line1: String!
  city: String!
  country: String
  isDefault: Boolean
}

input SellerVerificationInput {
  """Trading name shown to buyers"""
  storeName: String!

  """Name exactly as printed on the trade licence"""
  legalName: String!
  legalForm: LegalForm!
  emirate: Emirate!
  addressLine: String!

  """UAE number in +9715XXXXXXXX form"""
  phone: String!
  tradeLicenseNumber: String!

  """ISO date (YYYY-MM-DD) the licence expires"""
  tradeLicenseExpiry: String!

  """15 digits, formatted 784-YYYY-NNNNNNN-N"""
  emiratesIdNumber: String!

  """VAT number. Leave empty below the AED 375,000 registration threshold."""
  trn: String
}

type Subscription {
  messageAdded(conversationId: ID!): Message!
  notificationAdded: Notification!
}
